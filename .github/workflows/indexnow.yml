name: IndexNow production notifications
on:
  deployment_status:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'

permissions:
  contents: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.repository == 'Vanta-Hollow-Art/Vanta-Hollow' &&
      (github.event_name != 'deployment_status' ||
       (github.event.deployment_status.state == 'success' &&
        github.event.deployment.environment == 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node --test tests/indexnow.test.mjs
      - name: Verify production and submit changes
        run: node scripts/indexnow.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_REVISION: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || '' }}
